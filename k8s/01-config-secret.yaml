apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-ops-config
data:
  USAGE_SERVICE_URL: "http://usage-service:8000"
  COST_SERVICE_URL: "http://cost-service:8000"
  MODEL_MODE: "mock"
  MOCK_LATENCY_SCALE: "1.0"
  OLLAMA_URL: "http://host.docker.internal:11434"
  TZ: "Asia/Kolkata"
---
# Local KIND lab defaults only — replace via `kubectl create secret` before any shared/cloud deployment.
apiVersion: v1
kind: Secret
metadata:
  name: ai-ops-secrets
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "supersecret"
  AGENT_DATABASE_URL: "postgresql+asyncpg://agentuser:agentpass@postgres-db:5432/agentdb"
  USAGE_DATABASE_URL: "postgresql+asyncpg://usageuser:usagepass@postgres-db:5432/usagedb"
  COST_DATABASE_URL: "postgresql+asyncpg://costuser:costpass@postgres-db:5432/costdb"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
data:
  init.sql: |
    CREATE USER agentuser WITH PASSWORD 'agentpass';
    CREATE DATABASE agentdb OWNER agentuser;

    CREATE USER usageuser WITH PASSWORD 'usagepass';
    CREATE DATABASE usagedb OWNER usageuser;

    CREATE USER costuser WITH PASSWORD 'costpass';
    CREATE DATABASE costdb OWNER costuser;

    GRANT ALL PRIVILEGES ON DATABASE agentdb TO agentuser;
    GRANT ALL PRIVILEGES ON DATABASE usagedb TO usageuser;
    GRANT ALL PRIVILEGES ON DATABASE costdb TO costuser;
