apiVersion: apps/v1
kind: Deployment
metadata:
  name: usage-service
  labels:
    app: usage-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: usage-service
  template:
    metadata:
      labels:
        app: usage-service
    spec:
      containers:
        - name: usage-service
          image: lab/usage-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ai-ops-secrets
                  key: USAGE_DATABASE_URL
            - name: COST_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: ai-ops-config
                  key: COST_SERVICE_URL
            - name: MODEL_MODE
              valueFrom:
                configMapKeyRef:
                  name: ai-ops-config
                  key: MODEL_MODE
            - name: MOCK_LATENCY_SCALE
              valueFrom:
                configMapKeyRef:
                  name: ai-ops-config
                  key: MOCK_LATENCY_SCALE
            - name: OLLAMA_URL
              valueFrom:
                configMapKeyRef:
                  name: ai-ops-config
                  key: OLLAMA_URL
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: ai-ops-config
                  key: TZ
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: usage-service
spec:
  type: ClusterIP
  selector:
    app: usage-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: usage-service-nodeport
spec:
  type: NodePort
  selector:
    app: usage-service
  ports:
    - name: http-external
      port: 8002
      targetPort: 8000
      nodePort: 30082
