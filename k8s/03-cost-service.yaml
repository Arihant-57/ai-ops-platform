apiVersion: apps/v1
kind: Deployment
metadata:
  name: cost-service
  labels:
    app: cost-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cost-service
  template:
    metadata:
      labels:
        app: cost-service
    spec:
      containers:
        - name: cost-service
          image: lab/cost-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ai-ops-secrets
                  key: COST_DATABASE_URL
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: ai-ops-config
                  key: TZ
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1500m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: cost-service
spec:
  type: ClusterIP
  selector:
    app: cost-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: cost-service-nodeport
spec:
  type: NodePort
  selector:
    app: cost-service
  ports:
    - name: http-external
      port: 8003
      targetPort: 8000
      nodePort: 30083
